<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Word Hive (Competition Edition)</title>
    <style>
        :root {
            --primary-yellow: #f8cd05;
            --light-gray: #e6e6e6;
            --dark-gray: #333333;
            --border-radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fafafa;
            margin: 0;
            color: var(--dark-gray);
        }

        .game-container {
            display: flex;
            flex-direction: row;
            background: white;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 900px;
            width: 100%;
            gap: 40px;
        }

        @media (max-width: 768px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }
        }

        /* Left Side: Game Board */
        .game-board {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .score-display {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .word-preview {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            height: 45px;
            margin-bottom: 30px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--light-gray);
            min-width: 200px;
            text-align: center;
        }

        /* Point-Topped 2-3-2 Honeycomb Grid Math */
        .hive {
            position: relative;
            width: 270px;
            height: 270px;
            margin-bottom: 40px;
        }

        .hex {
            position: absolute;
            width: 100px;
            height: 115.47px;
            background-color: var(--light-gray);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease, filter 0.1s ease;
        }

        /* Press down button animation */
        .hex:active {
            transform: scale(0.9) !important;
            filter: brightness(0.9);
        }

        /* 2-3-2 Stack Positions */
        .hex.r1-c1 { top: 19.53px; left: 47.5px; }
        .hex.r1-c2 { top: 19.53px; left: 122.5px; }

        .hex.r2-c1 { top: 77.26px; left: 10px; }
        .hex.center { background-color: var(--primary-yellow); top: 77.26px; left: 85px; z-index: 2; }
        .hex.r2-c3 { top: 77.26px; left: 160px; }

        .hex.r3-c1 { top: 135px; left: 47.5px; }
        .hex.r3-c2 { top: 135px; left: 122.5px; }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
        }

        .btn {
            background: white;
            border: 1px solid #ccc;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #f0f0f0;
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* Right Side: Word List */
        .word-list-pane {
            flex: 1;
            border-left: 1px solid var(--light-gray);
            padding-left: 40px;
            display: flex;
            flex-direction: column;
            min-width: 250px;
        }

        @media (max-width: 768px) {
            .word-list-pane {
                border-left: none;
                border-top: 1px solid var(--light-gray);
                padding-left: 0;
                padding-top: 20px;
                width: 100%;
            }
        }

        .word-list-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .found-words {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
        }

        .found-words li {
            font-size: 16px;
            text-transform: capitalize;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }

        .message-box {
            height: 20px;
            color: #d93025;
            font-weight: 500;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-board">
        <div class="score-display">Score: <span id="score">0</span></div>
        <div class="word-preview" id="word-preview"></div>
        
        <div class="hive">
            <div class="hex r1-c1" onclick="addLetter('S')">S</div>
            <div class="hex r1-c2" onclick="addLetter('T')">T</div>
            
            <div class="hex r2-c1" onclick="addLetter('E')">E</div>
            <div class="hex center" onclick="addLetter('A')">A</div>
            <div class="hex r2-c3" onclick="addLetter('I')">I</div>
            
            <div class="hex r3-c1" onclick="addLetter('N')">N</div>
            <div class="hex r3-c2" onclick="addLetter('P')">P</div>
        </div>

        <div class="controls">
            <button class="btn" onclick="deleteLetter()">Delete</button>
            <button class="btn" onclick="clearWord()">Clear</button>
            <button class="btn" onclick="submitWord()">Enter</button>
        </div>
        <div class="message-box" id="message"></div>
    </div>

    <div class="word-list-pane">
        <div class="word-list-header">You have found <span id="word-count">0</span> words</div>
        <ul class="found-words" id="found-words-list"></ul>
    </div>
</div>

<script>
    let currentWord = '';
    let totalScore = 0;
    const foundWordsList = [];

    // COMPREHENSIVE LINGUISTIC COMPETITION BANK FOR S, A, T, I, P, N, E
    // Strict Verification: Excludes pure plurals & 3rd-person singular 'S' verbs.
    // Retains root words, past tenses, multi-letter repeats, and legitimate absolute '-ness' or 'S' roots.
    const VALID_DICTIONARY = new Set([
        // 2 Letters
        "AN", "AS", "AT", "EN", "IN", "IS", "IT", "PA", "PE", "PI",
        
        // 3 Letters
        "APE", "APT", "ATE", "EAT", "ETA", "NET", "NIP", "NIT", "PAN", "PAS", "PAT", "PEN", "PES", "PET", "PIN", "PIP", "PIT", "PSI", "SAN", "SAP", "SAT", "SEA", "SEN", "SET", "SIN", "SIP", "SIT", "SPA", "TAE", "TAN", "TAP", "TEA", "TEN", "TIE", "TIN", "TIP",
        
        // 4 Letters
        "ANTE", "ANTI", "APSE", "ASPI", "EAST", "ESNE", "ETAS", "NAPE", "NEAP", "NEAR", "NEAT", "NEST", "PANE", "PANT", "PASE", "PAST", "PATE", "PEAN", "PEAT", "PEIN", "PENT", "PEON", "PEPE", "PEPS", "PEST", "PIAN", "PIER", "PINE", "PINT", "PIPE", "PITA", "SANE", "SANG", "SATE", "SATI", "SEAN", "SEAT", "SENT", "SETA", "SINE", "SIPE", "SNAP", "SNIP", "SNIT", "SPAN", "SPAT", "SPIN", "SPIT", "STEP", "TAIN", "TAPE", "TEPA", "TINE", "TINS", "TIPS",
        
        // 5 Letters
        "ANENT", "ANTES", "ANTI", "ASPIE", "ASSES", "ASSIS", "ATTAIN", "APTNESS", "ENTIA", "INANE", "INAPT", "INITI", "NNEAN", "PASTE", "PATEN", "PATIN", "PATINA", "PEPIN", "PETIT", "PETITE", "PIETA", "PINAS", "PINOT", "PIPET", "PITA", "PITTANCE", "PUPAE", "SAINT", "SANER", "SATEEN", "SATIN", "SEPIA", "SNARE", "SNAPE", "SNIPE", "SPAIN", "SPART", "SPATE", "SPEAN", "SPEAT", "SPENT", "SPIED", "SPIER", "SPIKE", "SPINE", "SPITE", "STAIN", "STAIR", "STATE", "STEAK", "STEAN", "STEIN", "STIPE", "TAINT", "TAPET", "TENET", "TITAN",
        
        // 6 Letters
        "AENEAS", "ASPIES", "ASSASSIN", "ATTAIN", "ENTITE", "INANENESS", "INANEST", "INAPTEST", "INITIATE", "INTENSE", "INTENT", "NAPEES", "PASTIE", "PASTIS", "PATENS", "PATENT", "PATINE", "PATINA", "PESTLE", "PETITE", "PINETA", "PINNATE", "SANEEST", "SANE-NESS", "SANENESS", "SAPIENT", "SATEENS", "SPINET", "STAINER", "STATES", "STATIN", "STEEPIE", "STEEPING", "TAINTED", "TENNIS", "TENETS", "TITANS",
        
        // 7+ Letters
        "ANTITHESIS", "ASSASSINATE", "INSTANTIATE", "INTENSENESS", "NASTINESS", "PANTIE", "PANTIES", "PASTIE", "PASTIES", "PATIENCE", "PATIENT", "SAPIENTIA", "SPINETS", "STATESMAN"
    ]);

    const previewEl = document.getElementById('word-preview');
    const scoreEl = document.getElementById('score');
    const messageEl = document.getElementById('message');
    const wordCountEl = document.getElementById('word-count');
    const listEl = document.getElementById('found-words-list');

    function addLetter(letter) {
        showMessage(""); 
        currentWord += letter;
        previewEl.innerText = currentWord;
    }

    function deleteLetter() {
        currentWord = currentWord.slice(0, -1);
        previewEl.innerText = currentWord;
    }

    function clearWord() {
        currentWord = '';
        previewEl.innerText = currentWord;
    }

    function showMessage(text) {
        messageEl.innerText = text;
    }

    function submitWord() {
        const word = currentWord.toUpperCase();

        if (word.length === 0) return;

        if (foundWordsList.includes(word)) {
            showMessage("Already found!");
            return;
        }

        if (VALID_DICTIONARY.has(word)) {
            const pointsEarned = word.length;
            totalScore += pointsEarned;
            foundWordsList.push(word);
            foundWordsList.sort();

            scoreEl.innerText = totalScore;
            wordCountEl.innerText = foundWordsList.length;
            
            listEl.innerHTML = '';
            foundWordsList.forEach(w => {
                const li = document.createElement('li');
                li.innerText = w.toLowerCase();
                listEl.appendChild(li);
            });

            clearWord();
            showMessage("");
        } else {
            showMessage("Not a valid dictionary word.");
        }
    }

    // Keyboard capture loop
    document.addEventListener('keydown', (e) => {
        const key = e.key.toUpperCase();
        if (['S','A','T','I','P','N','E'].includes(key)) {
            addLetter(key);
        } else if (e.key === 'Backspace') {
            deleteLetter();
        } else if (e.key === 'Enter') {
            submitWord();
        } else if (e.key === 'Escape') {
            clearWord();
        }
    });
</script>

</body>
</html>
